version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Node major follows .nvmrc (CI + engines), bumped deliberately, not by Dependabot.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
