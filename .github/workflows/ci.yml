name: CI

on:
  pull_request:
    branches: [main, dev]
  # Railway deployuje z main (produkcja) i dev (staging) po każdym pushu,
  # a commity trafiają tam bezpośrednio, nie przez pull requesty. Bez tego
  # wyzwalacza żadna z dwóch gałęzi nie przechodziłaby przez żadną bramkę
  # jakości przed wdrożeniem.
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Obie strefy jawnie, nie „domyślna runnera + UTC": runner GitHuba i tak
      # chodzi w UTC, więc bez jawnego TZ oba przebiegi byłyby tym samym testem.
      # Produkcja (node:24-slim na Railway) to UTC, maszyna dewelopera to
      # Europe/Warsaw -- regresja strefowa potrafi iść w obie strony, a raz już
      # trafiła na produkcję (AGENTS.md #1).
      - run: npm run test
        env:
          TZ: Europe/Warsaw
      # Wariant z pokryciem świadomie tylko w JEDNYM z dwóch przebiegów:
      # progi (patrz vitest.config.mts) nie zależą od strefy, a liczenie
      # pokrycia dwa razy to czysty narzut. UTC, bo to strefa produkcji.
      - run: npm run test:coverage
        env:
          TZ: UTC

  # Osobny job świadomie: `quality` ma zostać bez przeglądarki i bez sieci
  # (AGENTS.md #6). `e2e` stawia realny build w trybie mock i klika po UI
  # na desktopie, mobile i WebKit. Patrz AGENTS.md #16.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium webkit
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
