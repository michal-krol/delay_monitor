name: CI

on:
  pull_request:
    branches: [main, dev]
  # Railway deployuje z main (produkcja) i dev (staging) po każdym pushu,
  # a commity trafiają tam bezpośrednio, nie przez pull requesty. Bez tego
  # wyzwalacza żadna z dwóch gałęzi nie przechodziłaby przez żadną bramkę
  # jakości przed wdrożeniem.
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
