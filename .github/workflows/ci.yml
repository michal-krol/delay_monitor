name: CI

on:
  pull_request:
    branches: [main, dev]
  # Railway deployuje z main (produkcja) i dev (staging) po każdym pushu.
  # `main` przyjmuje zmiany tylko przez PR z wymaganymi `quality` i `e2e`
  # (ruleset „branch-protection"); push-trigger sprawdza też stan po scaleniu
  # i ewentualne bezpośrednie zmiany na `dev`.
  push:
    branches: [main, dev]

# Nowy push do PR-a anuluje trwający przebieg tego samego PR-a (poprawki review, auto-fix):
# stary wynik i tak nikogo nie obchodzi, a macierz e2e to ~30 min runnerów. Pushe do main/dev
# NIE są anulowane — to one bramkują wdrożenie (Railway czeka na CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `quality` to teraz job zbiorczy pod starą nazwą (wymagany check ruleset „branch-protection");
  # praca idzie równolegle w trzech nogach poniżej. Zbiorczy musi mieć `always()`: bez tego
  # padnięta noga oznaczałaby POMINIĘTY job, a pominięty wymagany check przechodzi.
  quality:
    needs: [static, unit-warsaw, unit-utc-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for r in $RESULTS; do test "$r" = success || { echo "leg result: $r"; exit 1; }; done

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Obie strefy jawnie, nie „domyślna runnera + UTC": runner GitHuba i tak
  # chodzi w UTC, więc bez jawnego TZ oba przebiegi byłyby tym samym testem.
  # Produkcja (node:24-slim na Railway) to UTC, maszyna dewelopera to
  # Europe/Warsaw -- regresja strefowa potrafi iść w obie strony, a raz już
  # trafiła na produkcję (AGENTS.md #1).
  unit-warsaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
        env:
          TZ: Europe/Warsaw

  # Wariant z pokryciem świadomie tylko w JEDNYM z dwóch przebiegów:
  # progi (patrz vitest.config.mts) nie zależą od strefy, a liczenie
  # pokrycia dwa razy to czysty narzut. UTC, bo to strefa produkcji.
  unit-utc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          TZ: UTC

  # Osobny job świadomie: `quality` ma zostać bez przeglądarki i bez sieci
  # (AGENTS.md #6). `e2e-tests` stawia realny build w trybie mock i klika po UI;
  # jeden runner na projekt Playwrighta (desktop, mobile, WebKit), równolegle —
  # pojedynczy job trwał ~10 min, a 3 projekty szły jeden po drugim.
  # Build robi się w każdym jobie osobno (`webServer` w playwright.config.ts):
  # wspólny artefakt `.next` kosztowałby upload+download porównywalny z buildem,
  # a joby i tak idą równolegle. Patrz AGENTS.md #16.
  #
  # `changes` decides, from the list of changed files, whether the matrix runs at all: a PR that
  # only touches docs, agent rules, dev scripts, hooks or unit tests cannot change the built app
  # (allowlist in scripts/lib/ciScope.mjs; an unknown file runs the suite). Pushes to main/dev
  # always run it. `quality` is not conditional.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-scope.mjs "$BASE"

  e2e-tests:
    name: e2e-${{ matrix.project }}
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Lista projektów liczy `changes` (scripts/lib/ciScope.mjs `e2eMatrix`): WebKit tylko przy
      # pushu do main/dev i w PR-ach do main, PR do dev dostaje oba projekty chromium.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run e2e -- --project=${{ matrix.project }}
        env:
          E2E_WORKERS: 4
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Wymagany check ruleset „branch-protection" nazywa się dokładnie `e2e` —
  # ten job zbiera wynik macierzy pod starą nazwą (nie zmieniać bez ruleset).
  # `always()`: bez tego padnięta macierz oznaczałaby pominięty job, a pominięty
  # check wymagany przez ruleset przechodzi.
  # Skipped matrix is fine ONLY when `changes` ran and said e2e is not needed.
  e2e:
    needs: [changes, e2e-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      NEEDED: ${{ needs.changes.outputs.e2e }}
      MATRIX: ${{ needs.e2e-tests.result }}
    steps:
      - run: |
          test "$CHANGES" = success
          if [ "$NEEDED" = true ]; then test "$MATRIX" = success; else test "$MATRIX" = skipped; fi
