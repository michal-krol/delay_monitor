# Automatyczny przegląd PR-ów do `dev` przez Claude Code (audyt tokenów 2026-10-03, E2).
# Akcja: anthropics/claude-code-action (MIT), przypięta do SHA tagu v1.0.240
# (= v1 na 2026-10-03) — zewnętrzna akcja z dostępem do sekretu, więc nigdy po tagu
# (security.md). Dependabot (ecosystem github-actions) proponuje podbicia SHA.
# Auth: subskrypcja Claude przez sekret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
#
# Decyzje (źródło: code.claude.com/docs/en/github-actions + action.yml/docs/security.md
# akcji na przypiętym SHA):
# - `github_token: GITHUB_TOKEN` zamiast domyślnego tokenu aplikacji Claude: token jest
#   ograniczony do `permissions:` joba (bez `id-token: write`, bez zapisu do repo).
# - `--setting-sources user`: pomija `.claude/settings.json` z repo — hooki importują
#   `scripts/lib/`, który akcja bierze z głowy PR-a (docs/security.md akcji), a pluginy
#   z marketplace'ów stron trzecich nie mają czego szukać w CI i kosztują tokeny.
#   Skutek: CLAUDE.md nie ładuje się sam, więc prompt każe przeczytać AGENTS.md.
# - Concurrency na poziomie joba, osobno review i @claude: komentarz bez wzmianki
#   (job pominięty) nie anuluje trwającego przeglądu.
name: Claude review

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize]
  # Wzmianki `@claude`. Uwaga: `issue_comment` GitHub uruchamia z wersji workflow na
  # gałęzi domyślnej (main) — działa dopiero po wydaniu dev→main.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # Tylko gałęzie z tego repo (forki nie dostają sekretów), bez Dependabota.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # TEMP (diagnostic, revert before merge): the action hides the API error text otherwise.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for CORRECTNESS and SECURITY defects only.

            1. Read AGENTS.md (the project's numbered invariants #1-#17).
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the change.
            3. For each changed area, read only the `.claude/rules/*.md` file that the
               matching AGENTS.md invariant points to (e.g. src/lib/pkp/ -> pkp-time.md,
               pkp-board-data.md, pkp-budget.md; src/app/api/ -> security.md). Read
               surrounding source only where needed to confirm a finding.
            4. Report a finding only if you can name concrete inputs or state that make
               the code wrong, insecure, or break an AGENTS.md invariant (cite it as
               "AGENTS.md #N"). Do NOT report style, naming, formatting, refactoring,
               performance, documentation, test-coverage or "consider" suggestions.
            5. Post each finding as an inline comment on the exact changed line with
               mcp__github_inline_comment__create_inline_comment (confirmed: true).
               One issue per comment: what breaks, the triggering scenario, the fix.
            6. Finish with ONE short PR comment via `gh pr comment` listing the number of
               findings, or "No correctness/security findings." Never praise, never
               summarize the PR.

            Do not modify files, commit or push.
          claude_args: >-
            --max-turns 15
            --model sonnet
            --setting-sources user
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

  mention:
    # Tylko komentarze na PR-ach (nie na issues), tylko od osób z repo; akcja i tak
    # sprawdza prawo zapisu autora i odrzuca boty.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Bez `persist-credentials: false`: w trybie interaktywnym akcja robi `git fetch`
      # gałęzi PR-a, zanim ustawi własne uwierzytelnienie.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tryb interaktywny (bez `prompt`). Token ma `contents: read`, więc Claude
          # odpowiada w komentarzu, ale nie wypchnie zmian.
          claude_args: >-
            --max-turns 15
            --model sonnet
            --setting-sources user
            --append-system-prompt "Project rules are in AGENTS.md (numbered invariants) and .claude/rules/; read AGENTS.md before answering. You cannot push: answer and propose patches in the comment."
